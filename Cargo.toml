[package]
name = "gha-shell-proof"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "GitHub Actions run-step shell planner and compatibility checker for offline CI"
repository = "https://github.com/wildmason/gha-shell-proof"
homepage = "https://github.com/wildmason/gha-shell-proof"
readme = "README.md"
rust-version = "1.85"
keywords = ["github-actions", "shell", "ci", "testing", "runner"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anyhow = "1.0"
camino = { version = "1.2", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
